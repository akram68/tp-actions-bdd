
name: CI Pipeline

on:
  push:
  pull_request:

jobs:

  python:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PostgreSQL
        run: bash db/setup.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: python-app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: python-app
        run: pytest -v

  node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PostgreSQL
        run: bash db/setup.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: node-app
        run: npm ci

      - name: Run tests
        working-directory: node-app
        run: npm test

  java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PostgreSQL
        run: bash db/setup.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build and test
        working-directory: java-app
        run: mvn -B package

  php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PostgreSQL
        run: bash db/setup.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql

      - name: Install dependencies
        working-directory: php-app
        run: composer install --no-interaction

      - name: Run tests
        working-directory: php-app
        run: vendor/bin/phpunit tests

  build:
    runs-on: ubuntu-latest

    needs: [python, node, java, php]

    steps:
      - name: Build
        run: echo "Tous les tests sont réussis. Build en cours..."

  deploy:
    runs-on: ubuntu-latest

    needs: build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deployment message
        run: echo "Déploiement en cours"

      - name: Check deployment secret
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: test -n "$TOKEN" && echo "Token présent"
