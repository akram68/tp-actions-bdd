
name: Database Check

on:
  push:

jobs:
  db:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Préparer PostgreSQL
      - name: Setup PostgreSQL
        run: bash db/setup.sh

      # 3. Afficher les étudiants
      - name: Display students
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tp -c "SELECT * FROM students;"
